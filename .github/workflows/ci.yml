name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Swift tests
        run: swift test
      - name: Stub embedded core for Go compile
        run: mkdir -p go/assets && touch go/assets/playlist-md-core
      - name: Go tests
        run: go test ./...
        working-directory: go
      - name: Go vet
        run: go vet ./...
        working-directory: go
      - name: Check changelog release notes
        run: |
          sh -n scripts/release-notes.sh
          notes=$(sh scripts/release-notes.sh v1.0.0)
          printf '%s\n' "$notes" | grep -q '### Added'
          ! printf '%s\n' "$notes" | grep -q '^## \['
