name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Swift tests
        run: swift test
      - name: Stub embedded core for Go compile
        run: mkdir -p go/assets && touch go/assets/playlist-md-core
      - name: Go tests
        run: go test ./...
        working-directory: go
      - name: Go vet
        run: go vet ./...
        working-directory: go

      - name: Release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build universal binary
        run: make VERSION="${GITHUB_REF_NAME#v}"

      - name: Checksum
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="playlist-md-v${ver//./-}"
          shasum -a 256 "dist/${name}" | tee "dist/${name}.sha256"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="playlist-md-v${ver//./-}"
          bin="dist/${name}"
          test -x "$bin"
          gh release create "${GITHUB_REF_NAME}" \
            --title "playlist-md ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$bin" "${bin}.sha256"
